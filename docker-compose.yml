services:
  postgres:
    image: postgres:16-alpine
    container_name: krevia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: krevia
      POSTGRES_USER: krevia_user
      POSTGRES_PASSWORD: krevia_password
    ports:
      - "5433:5432"
    volumes:
      - krevia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krevia_user -d krevia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  krevia_postgres_data: